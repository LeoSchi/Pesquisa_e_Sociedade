<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bem-vindo a Curitiba – Guia para estrangeiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--v:#1e4d3b;--vc:#dce9e2;--f:#f4f7f5;--g:#1c2622;--s:#55645d;--r:#c8372d;--p:#e3b23c}
*{box-sizing:border-box}
body{margin:0;font:1.0625rem/1.6 "Source Sans 3",system-ui,sans-serif;color:var(--g);background:var(--f);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,h3,.marca{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;line-height:1.12;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.w{max-width:1040px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem) 7rem}
.topo{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;padding:.7rem clamp(1rem,4vw,3rem);background:rgba(30,77,59,.96);backdrop-filter:blur(6px);color:#fff}
.marca{font-weight:800;font-size:1.2rem;background:0;border:0;color:#fff;display:flex;align-items:center;gap:.5rem;padding:0}
.marca svg{color:var(--p)}
.abas{display:flex;flex-wrap:wrap;gap:.3rem}
.abas button{background:0;border:0;color:var(--vc);padding:.4rem .9rem;border-radius:999px}
.abas button.on{background:var(--p);color:var(--g);font-weight:600}
.lead{max-width:62ch;color:var(--s);font-size:1.15rem;margin:.8rem 0 0}
.hero{position:relative;background:linear-gradient(#f9e3a9,#cfe8e4 75%);overflow:hidden}
.hero-t{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:clamp(2rem,6vw,4.5rem) clamp(1rem,4vw,2rem) 13rem}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;color:var(--v);max-width:18ch}
.btn{margin-top:1.4rem;background:var(--v);color:#fff;border:0;border-radius:12px;padding:.85rem 1.4rem;font-weight:600}
.btn:hover{background:#163a2c}
.sky{position:absolute;left:0;right:0;bottom:0;height:270px}
.sky svg{width:100%;height:100%;display:block}
.primeiros{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-top:-6.5rem;position:relative;z-index:2}
.primeiros button{text-align:left;background:#fff;border:1px solid #d3ddd8;border-top:6px solid var(--c);border-radius:14px;padding:1rem 1.1rem;display:grid;gap:.15rem;box-shadow:0 8px 22px rgba(30,77,59,.12);transition:transform .15s}
.primeiros button:hover{transform:translateY(-3px)}
.primeiros strong{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.primeiros span{color:var(--s);font-size:.95rem}
.cab{background:var(--v);color:#fff;padding:clamp(2rem,5vw,3.5rem) 0 4.5rem;position:relative;margin-bottom:1.5rem}
.cab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:44px;background:var(--f);clip-path:ellipse(60% 100% at 50% 100%)}
.cab .w{padding-bottom:0}
.cab h2{font-size:clamp(1.9rem,4.5vw,2.8rem)}
.cab .lead{color:var(--vc)}
.grade{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.filtros{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.25rem}
.filtros button{border:1px solid #b7cdc1;background:#fff;border-radius:999px;padding:.35rem 1rem;color:var(--v)}
.filtros .on{background:var(--v);color:#fff;border-color:var(--v)}
.lugar{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #d3ddd8;transition:transform .15s,box-shadow .15s}
.lugar:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(30,77,59,.16)}
.foto{position:relative;aspect-ratio:5/3;background:var(--vc)}
.foto>div{height:100%}
.foto svg{width:100%;height:100%;display:block}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:.7rem;top:.7rem;background:rgba(255,255,255,.93);border-radius:999px;padding:.05rem .7rem;font-size:.85rem;font-weight:600;color:var(--v)}
.corpo{padding:1rem 1.15rem 1.2rem}
.corpo h3,.fato h3,.passos h3{font-size:1.2rem;color:var(--v);margin-bottom:.3rem}
.corpo p,.fato p,.passos p{margin:0}
.fato{background:#fff;border-radius:14px;padding:1.1rem 1.2rem;border:1px solid #d3ddd8;border-left:6px solid var(--c)}
.passos{list-style:none;counter-reset:p;padding:0;margin:0;max-width:760px;display:grid;gap:1rem}
.passos li{counter-increment:p;position:relative;background:#fff;border:1px solid #d3ddd8;border-radius:14px;padding:1rem 1.2rem 1rem 4.2rem}
.passos li::before{content:counter(p);position:absolute;left:1.1rem;top:1rem;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--v);color:#fff;display:grid;place-items:center;font-weight:600}
.aviso{max-width:760px;margin-top:1.5rem;padding:.9rem 1.1rem;background:#fbf2d6;border-left:6px solid var(--p);border-radius:12px}
.rodape{text-align:center;color:var(--s);font-size:.9rem;padding:0 1rem 5.5rem}
.chat{position:fixed;right:1rem;bottom:1rem;z-index:50}
.chat-fab{background:var(--r);color:#fff;border:0;border-radius:999px;padding:.85rem 1.4rem;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.chat-fab:hover{background:#a92c23}
.chat-caixa{width:min(380px,calc(100vw - 2rem));height:min(560px,calc(100vh - 2rem));display:flex;flex-direction:column;background:#fff;border:1px solid #c3d0ca;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.chat-caixa header{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;background:var(--v);color:#fff}
.chat-caixa header strong{flex:1}
.av{width:2rem;height:2rem;border-radius:50%;background:var(--p);color:var(--g);display:grid;place-items:center;font-weight:800}
.chat-min{background:0;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:8px;padding:.2rem .6rem;font-size:.9rem}
.chat-log{flex:1;overflow-y:auto;padding:.9rem;display:flex;flex-direction:column;gap:.6rem;background:var(--f)}
.msg{max-width:88%;padding:.55rem .8rem;border-radius:14px;white-space:pre-line;font-size:.98rem;line-height:1.45}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid #d3ddd8;border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--v);color:#fff;border-bottom-right-radius:4px}
.chat-opcoes{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem .9rem;max-height:38%;overflow-y:auto;border-top:1px solid #e0e7e3}
.chat-opcoes button{background:var(--vc);color:var(--v);border:1px solid #b7cdc1;border-radius:999px;padding:.35rem .8rem;font-size:.92rem;text-align:left}
.chat-opcoes button:hover{background:#c9ddd2}
.chat-opcoes .voltar{background:0;border-style:dashed}
.chat-form{display:flex;gap:.4rem;padding:.6rem .9rem .8rem;border-top:1px solid #e0e7e3}
.chat-form input{flex:1;min-width:0;border:1px solid #b7cdc1;border-radius:10px;padding:.5rem .7rem;font:inherit}
.chat-form button{background:var(--v);color:#fff;border:0;border-radius:10px;padding:0 1rem}
.av svg{width:1.6rem;height:1.6rem}.capi-cab{position:absolute;z-index:1;right:clamp(1rem,8vw,6rem);bottom:40px;width:110px}.capi-cab svg{width:100%;display:block}.capi-rodape{display:block;width:84px;margin:0 auto .3rem}.capi-rodape svg{width:100%;display:block}@media(max-width:820px){.capi-cab{display:none}}@media(max-width:760px){.chat{right:.5rem;bottom:.5rem}.hero-t{padding-bottom:12rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
